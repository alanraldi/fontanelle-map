<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="840" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="arr-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#3b82f6"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#10b981"/>
    </marker>
    <marker id="arr-o" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#ea580c"/>
    </marker>
    <marker id="arr-v" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#7c3aed"/>
    </marker>
    <marker id="arr-s" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Page background -->
  <rect width="1100" height="840" fill="#f8fafc" rx="12"/>

  <!-- TITLE -->
  <text x="550" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Fontanelle Map — Stacks e Migração para Servidor</text>
  <text x="550" y="58" text-anchor="middle" font-size="12" fill="#64748b">Como as stacks se conectam hoje e o que muda ao adicionar um servidor próprio</text>

  <!-- CENTER DIVIDER -->
  <line x1="550" y1="74" x2="550" y2="795" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8,5"/>

  <!-- ════════════════════════════════ LEFT PANEL ════════════════════════════════ -->
  <rect x="16" y="74" width="520" height="710" fill="#f1f5f9" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Panel label -->
  <rect x="100" y="86" width="320" height="34" rx="6" fill="#e2e8f0"/>
  <text x="260" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Hoje — SPA Pura</text>
  <text x="260" y="116" text-anchor="middle" font-size="10" fill="#64748b">Todas as chamadas saem direto do browser</text>

  <!-- Browser / SPA -->
  <rect x="120" y="132" width="280" height="56" rx="8" fill="#2563eb"/>
  <text x="260" y="156" text-anchor="middle" font-size="13" font-weight="600" fill="white">Browser</text>
  <text x="260" y="174" text-anchor="middle" font-size="10" fill="#bfdbfe">React SPA hospedada no Netlify CDN</text>

  <!-- Arrow Browser → Hooks -->
  <line x1="260" y1="188" x2="260" y2="214" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Hooks -->
  <rect x="42" y="214" width="436" height="50" rx="8" fill="#1d4ed8"/>
  <text x="260" y="234" text-anchor="middle" font-size="11" font-weight="600" fill="white">Hooks / Context</text>
  <text x="260" y="251" text-anchor="middle" font-size="9" fill="#bfdbfe">useFountainsByBounds · useNominatim · useReverseGeocode · GeolocationContext</text>

  <!-- Arrows Hooks → 3 APIs -->
  <line x1="140" y1="264" x2="100" y2="300" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <line x1="260" y1="264" x2="260" y2="300" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <line x1="380" y1="264" x2="418" y2="300" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Overpass API -->
  <rect x="36" y="300" width="130" height="68" rx="8" fill="#059669"/>
  <text x="101" y="325" text-anchor="middle" font-size="11" font-weight="600" fill="white">Overpass API</text>
  <text x="101" y="341" text-anchor="middle" font-size="9" fill="#a7f3d0">Fontanelas por viewport</text>
  <text x="101" y="357" text-anchor="middle" font-size="8" fill="#6ee7b7">overpass-api.de</text>

  <!-- Nominatim Busca -->
  <rect x="196" y="300" width="130" height="68" rx="8" fill="#059669"/>
  <text x="261" y="325" text-anchor="middle" font-size="11" font-weight="600" fill="white">Nominatim</text>
  <text x="261" y="341" text-anchor="middle" font-size="9" fill="#a7f3d0">Busca de cidades</text>
  <text x="261" y="357" text-anchor="middle" font-size="8" fill="#6ee7b7">nominatim.osm.org/search</text>

  <!-- Nominatim Reverse -->
  <rect x="356" y="300" width="130" height="68" rx="8" fill="#059669"/>
  <text x="421" y="325" text-anchor="middle" font-size="11" font-weight="600" fill="white">Nominatim</text>
  <text x="421" y="341" text-anchor="middle" font-size="9" fill="#a7f3d0">Reverse geocoding</text>
  <text x="421" y="357" text-anchor="middle" font-size="8" fill="#6ee7b7">nominatim.osm.org/reverse</text>

  <!-- Dashed arrows: Browser → CartoDB, Browser → GMaps -->
  <line x1="192" y1="188" x2="140" y2="408" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-s)"/>
  <line x1="328" y1="188" x2="380" y2="408" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-s)"/>

  <!-- CartoDB Tiles -->
  <rect x="46" y="408" width="180" height="58" rx="8" fill="#475569"/>
  <text x="136" y="432" text-anchor="middle" font-size="11" font-weight="600" fill="white">CartoDB Tiles</text>
  <text x="136" y="448" text-anchor="middle" font-size="9" fill="#e2e8f0">Mapa base — direto do browser</text>
  <text x="136" y="460" text-anchor="middle" font-size="7.5" fill="#94a3b8">basemaps.cartocdn.com</text>

  <!-- Google Maps link -->
  <rect x="250" y="408" width="240" height="58" rx="8" fill="#475569"/>
  <text x="370" y="432" text-anchor="middle" font-size="11" font-weight="600" fill="white">Google Maps</text>
  <text x="370" y="448" text-anchor="middle" font-size="9" fill="#e2e8f0">Redirect externo (link, sem API key)</text>
  <text x="370" y="460" text-anchor="middle" font-size="7.5" fill="#94a3b8">google.com/maps/dir/?api=1&amp;travelmode=walking</text>

  <!-- Limitações box -->
  <rect x="36" y="490" width="448" height="94" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="260" y="511" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">⚠  Limitações da arquitetura atual</text>
  <text x="260" y="529" text-anchor="middle" font-size="10" fill="#7f1d1d">• Rate limit Nominatim: 1 req/s — sem cache, chamadas podem ser bloqueadas</text>
  <text x="260" y="546" text-anchor="middle" font-size="10" fill="#7f1d1d">• CORS depende de permissão dos serviços externos (Overpass, Nominatim)</text>
  <text x="260" y="563" text-anchor="middle" font-size="10" fill="#7f1d1d">• Sem persistência: nenhum favorito, histórico ou autenticação</text>
  <text x="260" y="580" text-anchor="middle" font-size="10" fill="#7f1d1d">• Monitoramento e analytics limitados (só frontend)</text>

  <!-- URLs hardcoded note -->
  <rect x="36" y="600" width="448" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="260" y="621" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1d4ed8">URLs hardcoded nos hooks (sem .env)</text>
  <text x="260" y="639" text-anchor="middle" font-size="9" font-family="monospace" fill="#1e3a8a">useFountainsByBounds  →  overpass-api.de/api/interpreter</text>
  <text x="260" y="655" text-anchor="middle" font-size="9" font-family="monospace" fill="#1e3a8a">useNominatim          →  nominatim.openstreetmap.org/search</text>
  <text x="260" y="671" text-anchor="middle" font-size="9" font-family="monospace" fill="#1e3a8a">useReverseGeocode     →  nominatim.openstreetmap.org/reverse</text>

  <!-- ════════════════════════════════ RIGHT PANEL ════════════════════════════════ -->
  <rect x="564" y="74" width="520" height="710" fill="#f0fdf4" rx="10" stroke="#86efac" stroke-width="1.5"/>

  <!-- Panel label -->
  <rect x="648" y="86" width="352" height="34" rx="6" fill="#dcfce7"/>
  <text x="824" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Com Servidor Próprio</text>
  <text x="824" y="116" text-anchor="middle" font-size="10" fill="#166534">Proxy via API interna — cache, rate limit, auth, favoritos</text>

  <!-- Browser / SPA right -->
  <rect x="694" y="132" width="260" height="56" rx="8" fill="#2563eb"/>
  <text x="824" y="156" text-anchor="middle" font-size="13" font-weight="600" fill="white">Browser</text>
  <text x="824" y="174" text-anchor="middle" font-size="10" fill="#bfdbfe">Mesmo React SPA (3 URLs alteradas)</text>

  <!-- Arrow Browser → Hooks right -->
  <line x1="824" y1="188" x2="824" y2="214" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Hooks right -->
  <rect x="590" y="214" width="468" height="50" rx="8" fill="#1d4ed8"/>
  <text x="824" y="234" text-anchor="middle" font-size="11" font-weight="600" fill="white">Hooks / Context (mesmos arquivos)</text>
  <text x="824" y="251" text-anchor="middle" font-size="9" fill="#bfdbfe">URLs trocadas para /api/fountains · /api/search · /api/reverse</text>

  <!-- Arrow Hooks → Backend Server -->
  <line x1="824" y1="264" x2="824" y2="296" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arr-o)"/>

  <!-- Backend Server box -->
  <rect x="654" y="296" width="340" height="74" rx="8" fill="#c2410c"/>
  <text x="824" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="white">Servidor Backend</text>
  <text x="824" y="340" text-anchor="middle" font-size="10" fill="#fed7aa">Node.js / Bun / Python / Go</text>
  <text x="824" y="357" text-anchor="middle" font-size="9" fill="#ffedd5">Rate limiting · Cache · Auth (opcional) · Logs · Proxy</text>

  <!-- Arrow Backend → Cache Redis -->
  <line x1="740" y1="370" x2="698" y2="410" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-v)"/>

  <!-- Arrow Backend → Database -->
  <line x1="908" y1="370" x2="950" y2="410" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-v)"/>

  <!-- Cache Redis -->
  <rect x="576" y="410" width="230" height="66" rx="8" fill="#6d28d9"/>
  <text x="691" y="436" text-anchor="middle" font-size="12" font-weight="600" fill="white">Cache</text>
  <text x="691" y="453" text-anchor="middle" font-size="9.5" fill="#ede9fe">Redis / in-memory</text>
  <text x="691" y="468" text-anchor="middle" font-size="9" fill="#ddd6fe">TTL por região e viewport</text>

  <!-- Database -->
  <rect x="872" y="410" width="188" height="66" rx="8" fill="#6d28d9"/>
  <text x="966" y="436" text-anchor="middle" font-size="12" font-weight="600" fill="white">Database</text>
  <text x="966" y="453" text-anchor="middle" font-size="9.5" fill="#ede9fe">PostgreSQL / SQLite</text>
  <text x="966" y="468" text-anchor="middle" font-size="9" fill="#ddd6fe">favoritos, usuários</text>

  <!-- Arrows Cache → External APIs (dashed = cache miss only) -->
  <line x1="658" y1="476" x2="648" y2="516" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <line x1="724" y1="476" x2="792" y2="516" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>

  <!-- Overpass API right -->
  <rect x="576" y="516" width="148" height="66" rx="8" fill="#059669"/>
  <text x="650" y="542" text-anchor="middle" font-size="11" font-weight="600" fill="white">Overpass API</text>
  <text x="650" y="559" text-anchor="middle" font-size="9" fill="#a7f3d0">só em cache miss</text>
  <text x="650" y="572" text-anchor="middle" font-size="7.5" fill="#6ee7b7">overpass-api.de</text>

  <!-- Nominatim right -->
  <rect x="742" y="516" width="148" height="66" rx="8" fill="#059669"/>
  <text x="816" y="542" text-anchor="middle" font-size="11" font-weight="600" fill="white">Nominatim</text>
  <text x="816" y="559" text-anchor="middle" font-size="9" fill="#a7f3d0">só em cache miss</text>
  <text x="816" y="572" text-anchor="middle" font-size="7.5" fill="#6ee7b7">nominatim.osm.org</text>

  <!-- CartoDB still direct (dashed from browser right) -->
  <line x1="900" y1="188" x2="970" y2="516" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-s)"/>
  <rect x="898" y="516" width="162" height="66" rx="8" fill="#475569"/>
  <text x="979" y="542" text-anchor="middle" font-size="11" font-weight="600" fill="white">CartoDB Tiles</text>
  <text x="979" y="559" text-anchor="middle" font-size="9" fill="#e2e8f0">ainda direto do browser</text>
  <text x="979" y="572" text-anchor="middle" font-size="7.5" fill="#94a3b8">(sem mudança)</text>

  <!-- "O que muda" box -->
  <rect x="576" y="606" width="480" height="162" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="816" y="628" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">O que muda no frontend — 3 linhas de código</text>

  <rect x="588" y="636" width="456" height="22" rx="4" fill="#ffedd5"/>
  <text x="816" y="651" text-anchor="middle" font-size="9" font-family="monospace" fill="#7c2d12">useFountainsByBounds.ts  →  fetch('/api/fountains', { ... })</text>

  <rect x="588" y="661" width="456" height="22" rx="4" fill="#ffedd5"/>
  <text x="816" y="676" text-anchor="middle" font-size="9" font-family="monospace" fill="#7c2d12">useNominatim.ts          →  fetch('/api/search?q='+term)</text>

  <rect x="588" y="686" width="456" height="22" rx="4" fill="#ffedd5"/>
  <text x="816" y="701" text-anchor="middle" font-size="9" font-family="monospace" fill="#7c2d12">useReverseGeocode.ts     →  fetch('/api/reverse?lat=…&amp;lng=…')</text>

  <line x1="588" y1="716" x2="1064" y2="716" stroke="#fed7aa" stroke-width="1"/>
  <text x="816" y="731" text-anchor="middle" font-size="10" fill="#92400e">CartoDB tiles e link Google Maps não mudam — seguem direto do browser</text>
  <text x="816" y="749" text-anchor="middle" font-size="10" font-weight="600" fill="#b45309">Ganho: cache, rate limit controlado, auth, favoritos, analytics próprios</text>
  <text x="816" y="765" text-anchor="middle" font-size="9" fill="#78350f">Deploy: Netlify (frontend) + Railway / Fly.io / VPS (backend)</text>

  <!-- ════════════════════════════════ LEGEND ════════════════════════════════ -->
  <rect x="16" y="796" width="1068" height="36" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="30" y="808" width="12" height="12" rx="2" fill="#2563eb"/>
  <text x="48" y="819" font-size="10" fill="#374151">Frontend</text>

  <rect x="108" y="808" width="12" height="12" rx="2" fill="#059669"/>
  <text x="126" y="819" font-size="10" fill="#374151">APIs externas</text>

  <rect x="218" y="808" width="12" height="12" rx="2" fill="#c2410c"/>
  <text x="236" y="819" font-size="10" fill="#374151">Backend próprio</text>

  <rect x="338" y="808" width="12" height="12" rx="2" fill="#6d28d9"/>
  <text x="356" y="819" font-size="10" fill="#374151">Cache / DB</text>

  <rect x="430" y="808" width="12" height="12" rx="2" fill="#475569"/>
  <text x="448" y="819" font-size="10" fill="#374151">Direto (tiles / redirect)</text>

  <line x1="580" y1="814" x2="608" y2="814" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="618" y="819" font-size="10" fill="#374151">Chamada direta browser</text>

  <line x1="752" y1="814" x2="780" y2="814" stroke="#ea580c" stroke-width="2"/>
  <text x="790" y="819" font-size="10" fill="#374151">Via servidor (proxy)</text>

  <line x1="880" y1="814" x2="908" y2="814" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="918" y="819" font-size="10" fill="#374151">Só em cache miss</text>
</svg>
