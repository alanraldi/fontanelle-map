<svg xmlns="http://www.w3.org/2000/svg" width="920" height="780" viewBox="0 0 920 780" font-family="system-ui, -apple-system, sans-serif">
  <rect width="920" height="780" fill="#f8fafc" rx="8"/>

  <!-- TITLE -->
  <text x="460" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Fontanelle Map — Arquitetura</text>
  <text x="460" y="50" text-anchor="middle" font-size="12" fill="#64748b">fontanelle-map.netlify.app · React 19 + Vite 6 + Leaflet</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LAYER 1: SERVIÇOS EXTERNOS -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="14" y="62" width="892" height="118" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="24" y="80" font-size="11" font-weight="600" fill="#1d4ed8" letter-spacing="1">SERVIÇOS EXTERNOS</text>

  <!-- Overpass API -->
  <rect x="28" y="88" width="190" height="82" rx="8" fill="white" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="123" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Overpass API</text>
  <text x="123" y="124" text-anchor="middle" font-size="10" fill="#475569">POST /api/interpreter</text>
  <text x="123" y="138" text-anchor="middle" font-size="10" fill="#475569">amenity=drinking_water</text>
  <text x="123" y="152" text-anchor="middle" font-size="10" fill="#475569">man_made=water_tap</text>

  <!-- Nominatim -->
  <rect x="234" y="88" width="210" height="82" rx="8" fill="white" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="339" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Nominatim OSM</text>
  <text x="339" y="124" text-anchor="middle" font-size="10" fill="#475569">GET /search — busca cidades</text>
  <text x="339" y="138" text-anchor="middle" font-size="10" fill="#475569">GET /reverse — endereço</text>
  <text x="339" y="152" text-anchor="middle" font-size="10" fill="#475569">a partir de coordenadas</text>

  <!-- CartoDB -->
  <rect x="460" y="88" width="190" height="82" rx="8" fill="white" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="555" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">CartoDB Positron</text>
  <text x="555" y="124" text-anchor="middle" font-size="10" fill="#475569">Tiles do mapa</text>
  <text x="555" y="138" text-anchor="middle" font-size="10" fill="#475569">Sem API key</text>
  <text x="555" y="152" text-anchor="middle" font-size="10" fill="#475569">light_all/{z}/{x}/{y}.png</text>

  <!-- Google Maps -->
  <rect x="666" y="88" width="230" height="82" rx="8" fill="white" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="781" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Google Maps</text>
  <text x="781" y="124" text-anchor="middle" font-size="10" fill="#475569">Link externo (href)</text>
  <text x="781" y="138" text-anchor="middle" font-size="10" fill="#475569">origin=GPS &amp; destination=</text>
  <text x="781" y="152" text-anchor="middle" font-size="10" fill="#475569">fountain &amp; travelmode=walking</text>

  <!-- ARROWS down from external -->
  <line x1="123" y1="180" x2="123" y2="208" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="339" y1="180" x2="280" y2="208" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="339" y1="180" x2="400" y2="208" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LAYER 2: HOOKS & CONTEXTO -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="14" y="212" width="892" height="148" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="24" y="230" font-size="11" font-weight="600" fill="#065f46" letter-spacing="1">HOOKS &amp; CONTEXTO</text>

  <!-- useFountainsByBounds -->
  <rect x="28" y="238" width="215" height="68" rx="8" fill="white" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="135" y="256" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">useFountainsByBounds</text>
  <text x="135" y="271" text-anchor="middle" font-size="10" fill="#475569">fetch Overpass por viewport</text>
  <text x="135" y="285" text-anchor="middle" font-size="10" fill="#475569">zoom ≥ 10 · timeout 25s</text>

  <!-- useNominatim -->
  <rect x="258" y="238" width="185" height="68" rx="8" fill="white" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="350" y="256" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">useNominatim</text>
  <text x="350" y="271" text-anchor="middle" font-size="10" fill="#475569">autocomplete cidades</text>
  <text x="350" y="285" text-anchor="middle" font-size="10" fill="#475569">debounce 300ms</text>

  <!-- useReverseGeocode -->
  <rect x="458" y="238" width="195" height="68" rx="8" fill="white" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="555" y="256" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">useReverseGeocode</text>
  <text x="555" y="271" text-anchor="middle" font-size="10" fill="#475569">endereço por coordenadas</text>
  <text x="555" y="285" text-anchor="middle" font-size="10" fill="#475569">fallback display_name</text>

  <!-- GeolocationContext -->
  <rect x="28" y="318" width="215" height="34" rx="8" fill="white" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="135" y="331" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">GeolocationContext</text>
  <text x="135" y="344" text-anchor="middle" font-size="10" fill="#475569">lat · lng · status · requestLocation</text>

  <!-- useDistance -->
  <rect x="258" y="318" width="185" height="34" rx="8" fill="white" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="350" y="331" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">useDistance</text>
  <text x="350" y="344" text-anchor="middle" font-size="10" fill="#475569">haversine · ordena por distância</text>

  <!-- normalizeOverpass -->
  <rect x="458" y="318" width="195" height="34" rx="8" fill="white" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="555" y="331" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">normalizeOverpass</text>
  <text x="555" y="344" text-anchor="middle" font-size="10" fill="#475569">OverpassElement → Fountain</text>

  <!-- Fountain type note -->
  <rect x="668" y="238" width="228" height="114" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="782" y="258" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Tipo Fountain</text>
  <text x="782" y="273" text-anchor="middle" font-size="10" fill="#64748b">id · lat · lng · address · city</text>
  <text x="782" y="287" text-anchor="middle" font-size="10" fill="#64748b">status · distance? · name?</text>
  <text x="782" y="301" text-anchor="middle" font-size="10" fill="#64748b">operator? · description?</text>
  <text x="782" y="323" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">FilterOption</text>
  <text x="782" y="337" text-anchor="middle" font-size="10" fill="#64748b">'all' | 'active' | 'inactive' | 'unknown'</text>

  <!-- ARROWS down -->
  <line x1="135" y1="360" x2="135" y2="390" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="350" y1="360" x2="350" y2="390" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="555" y1="360" x2="555" y2="390" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LAYER 3: APP STATE -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="14" y="394" width="892" height="58" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="24" y="412" font-size="11" font-weight="600" fill="#92400e" letter-spacing="1">APP STATE (App.tsx)</text>
  <text x="460" y="430" text-anchor="middle" font-size="12" fill="#78350f">selectedFountain · filter · mapRef · boundsDebounce (1000ms) · loadingState · error</text>
  <text x="460" y="446" text-anchor="middle" font-size="11" fill="#92400e">GeolocationProvider  ·  Suspense (lazy MapView)</text>

  <!-- ARROWS down -->
  <line x1="200" y1="452" x2="200" y2="478" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <line x1="420" y1="452" x2="420" y2="478" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <line x1="640" y1="452" x2="640" y2="478" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LAYER 4: COMPONENTES UI -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="14" y="482" width="892" height="284" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="24" y="500" font-size="11" font-weight="600" fill="#4c1d95" letter-spacing="1">COMPONENTES UI</text>

  <!-- Row 1: Header, CitySearch, MapView -->
  <!-- Header -->
  <rect x="28" y="508" width="185" height="88" rx="8" fill="white" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="120" y="526" text-anchor="middle" font-size="12" font-weight="600" fill="#4c1d95">Header</text>
  <text x="120" y="541" text-anchor="middle" font-size="10" fill="#475569">Logo · contador fontanelas</text>
  <text x="120" y="555" text-anchor="middle" font-size="10" fill="#475569">Botão GPS</text>
  <text x="120" y="569" text-anchor="middle" font-size="10" fill="#475569">Endereço usuário</text>
  <text x="120" y="583" text-anchor="middle" font-size="10" fill="#7c3aed">← useReverseGeocode</text>

  <!-- CitySearch -->
  <rect x="228" y="508" width="185" height="88" rx="8" fill="white" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="320" y="526" text-anchor="middle" font-size="12" font-weight="600" fill="#4c1d95">CitySearch</text>
  <text x="320" y="541" text-anchor="middle" font-size="10" fill="#475569">Input de busca</text>
  <text x="320" y="555" text-anchor="middle" font-size="10" fill="#475569">Dropdown sugestões</text>
  <text x="320" y="569" text-anchor="middle" font-size="10" fill="#475569">mapRef.fitBounds()</text>
  <text x="320" y="583" text-anchor="middle" font-size="10" fill="#7c3aed">← useNominatim</text>

  <!-- MapView -->
  <rect x="428" y="508" width="468" height="88" rx="8" fill="white" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="662" y="526" text-anchor="middle" font-size="12" font-weight="600" fill="#4c1d95">MapView</text>
  <text x="662" y="542" text-anchor="middle" font-size="10" fill="#475569">MapContainer (CartoDB tiles) · leaflet.markercluster</text>
  <text x="662" y="557" text-anchor="middle" font-size="10" fill="#475569">FountainMarker (divIcon por status) · UserLocationMarker (ponto azul)</text>
  <text x="662" y="571" text-anchor="middle" font-size="10" fill="#475569">BoundsTracker (moveend/zoomend) · MapInstanceSetter (mapRef)</text>
  <text x="662" y="585" text-anchor="middle" font-size="10" fill="#7c3aed">GPS: map.flyTo() · CitySearch: map.fitBounds()</text>

  <!-- Row 2: BottomSheet -->
  <rect x="28" y="612" width="868" height="144" rx="8" fill="white" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="462" y="630" text-anchor="middle" font-size="12" font-weight="600" fill="#4c1d95">BottomSheet</text>
  <text x="462" y="644" text-anchor="middle" font-size="10" fill="#475569">Pointer Events (mouse + touch) · 52vh expandido / 64px colapsado · "Aggiornando..." spinner</text>

  <!-- FilterChips -->
  <rect x="42" y="652" width="200" height="94" rx="6" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="142" y="669" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">FilterChips</text>
  <text x="142" y="684" text-anchor="middle" font-size="10" fill="#475569">Todos / Attiva</text>
  <text x="142" y="698" text-anchor="middle" font-size="10" fill="#475569">Inattiva / Sconosciuta</text>
  <text x="142" y="712" text-anchor="middle" font-size="10" fill="#475569">contagem por status</text>

  <!-- FountainList -->
  <rect x="256" y="652" width="280" height="94" rx="6" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="396" y="669" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">FountainList</text>
  <text x="396" y="684" text-anchor="middle" font-size="10" fill="#475569">Lista acessível (aria-live)</text>
  <text x="396" y="698" text-anchor="middle" font-size="10" fill="#475569">Skeleton (só sem dados)</text>
  <text x="396" y="712" text-anchor="middle" font-size="10" fill="#475569">Estado idle / error / empty</text>

  <!-- FountainCard -->
  <rect x="550" y="652" width="332" height="94" rx="6" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="716" y="669" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">FountainCard</text>
  <text x="716" y="684" text-anchor="middle" font-size="10" fill="#475569">nome · endereço (OSM ou reverse geocode)</text>
  <text x="716" y="698" text-anchor="middle" font-size="10" fill="#475569">status badge · distância · operador</text>
  <text x="716" y="712" text-anchor="middle" font-size="10" fill="#7c3aed">→ Indicazioni (Google Maps, walking)</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- PRODUÇÃO badge -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="666" y="744" width="240" height="28" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="786" y="763" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">🚀  Netlify · fontanelle-map.netlify.app</text>

  <!-- Git badge -->
  <rect x="14" y="744" width="240" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="134" y="763" text-anchor="middle" font-size="11" fill="#475569">GitHub · alanraldi/fontanelle-map</text>

  <!-- Tests badge -->
  <rect x="340" y="744" width="240" height="28" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="460" y="763" text-anchor="middle" font-size="11" fill="#15803d">✅  57 testes · Vitest · 10 arquivos</text>

  <!-- ARROW MARKERS -->
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ca8a04"/>
    </marker>
  </defs>
</svg>
